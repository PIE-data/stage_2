# Defaults for the indexing service. Every key can be overridden:
#   environment variable  SERVER_PORT=... (key in upper case, dots and dashes -> underscores)
#   JVM property          -Dserver.port=...
#   external file         CONFIG_FILE=/path/to/file.properties
service.name=indexing
server.port=7002
# Jetty request threads per process (these values equal Javalin's own defaults).
server.threads.min=8
server.threads.max=250
# Root of the workspace: datalake/ (read) and datamarts/ (written) live under it.
data.dir=./data
# SQLite page cache of the datamart writer, MiB (docs/DATAMART.md section 1).
datamart.cache-mb=256
broker.url=tcp://localhost:61616
# Consumer sessions on books.downloaded in this process (docs/EVENTS.md).
consumer.threads=2
