# Defaults for the ingestion service. Every key can be overridden:
#   environment variable  SERVER_PORT=... (key in upper case, dots and dashes -> underscores)
#   JVM property          -Dserver.port=...
#   external file         CONFIG_FILE=/path/to/file.properties
service.name=ingestion
server.port=7001
# Jetty request threads per process (these values equal Javalin's own defaults).
server.threads.min=8
server.threads.max=250
# Root of the workspace: datalake/ and control/ live under it.
data.dir=./data
# Where books are downloaded from (Gutenberg or the local mirror).
gutenberg.base-url=https://www.gutenberg.org/cache/epub
broker.url=tcp://localhost:61616
